spring.application.name=Plazoleta
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/plazoleta_bd}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SQL_LOGGING:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.auth.secret=${AUTH_SECRET:}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN:}
app.usuarios.base-url=${USUARIOS_BASE_URL:http://localhost:8081}
app.usuarios.owner-validation-path=${USUARIOS_OWNER_VALIDATION_PATH:/api/v1/usuarios/{id}/validacion-propietario}
app.usuarios.service-token=${INTERNAL_SERVICE_TOKEN:}