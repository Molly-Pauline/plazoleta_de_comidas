spring.datasource.url=jdbc:h2:mem:plazoleta-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.auth.secret=test-secret-with-at-least-16-chars
app.usuarios.base-url=http://localhost:8081
app.usuarios.owner-validation-path=/api/v1/usuarios/{id}/validacion-propietario
app.usuarios.service-token=test-internal-service-token-at-least-32-chars
app.internal.service-token=test-internal-service-token-at-least-32-chars